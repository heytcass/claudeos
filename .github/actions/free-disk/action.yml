# The NixOS closure overflows the stock runner's ~14 GB free disk (the first
# host-build run died on ENOSPC) — purge the preinstalled toolchains.
# Local rather than wimpysworld/nothing-but-nix: that action nests an unpinned
# srz-zumix/post-run-action@v3 (still in v10), which the repo-level
# sha_pinning_required enforcement rejects at job setup. A local composite
# action has no ref to pin, so it passes that rule by construction.
name: Free runner disk
description: Delete preinstalled toolchains the Nix builds never use
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache /usr/local/share/boost /usr/local/graalvm \
          /usr/local/share/powershell /usr/local/lib/node_modules \
          /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h /
