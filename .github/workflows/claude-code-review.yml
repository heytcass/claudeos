name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # write, not read: with `pull-requests: read` this job could not have
    # posted a review even if it produced one. Whether that alone explains the
    # silence is still open — see issue #32.
    #
    # Do NOT diagnose this workflow from a PR that edits this file.
    # claude-code-action refuses to run when the workflow file differs from the
    # copy on the default branch ("Workflow validation failed"), so the job
    # exits success in ~6s having done nothing. That is a security control, not
    # a bug: a PR must not be able to rewrite the review workflow and capture
    # the app token. PR #30 edited this file and so could not test its own fix —
    # a mistake already made once, in the comment this one replaces.
    #
    # Nothing depends on it. The rung-2 merge gate (heal-automerge.yml)
    # deliberately does NOT consume this job's result — it makes its own Claude
    # call with a strict verdict contract. This review is for the human, and
    # its absence blocks nothing.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

