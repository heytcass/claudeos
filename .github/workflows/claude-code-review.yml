name: Claude Code Review

on:
  pull_request:
    # No `synchronize` — deliberately. This review costs Claude subscription
    # tokens per run (~$2.33 and 38 turns on one PR #28 run), and going public
    # made GitHub-hosted minutes free but did nothing about that. Reviewing on
    # every push meant paying N+1 times per PR for prose nobody blocks on:
    # nothing consumes this job's result (heal-automerge.yml makes its own
    # Claude call with a strict verdict contract), and per issue #32 it has
    # posted zero reviews on every PR it has ever run against. Ask for a
    # re-review on demand by mentioning @claude instead.
    #
    # `reopened` is kept: it is rare, and a PR resurrected after months is
    # exactly when a fresh read is worth one run.
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    # Same-repo PRs only. Fork PRs never receive the OAuth secret anyway
    # (GitHub withholds secrets from fork pull_request runs), so without this
    # gate every drive-by fork PR would spin a runner just to fail red. This
    # makes them a clean no-op instead.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    # write, not read: with `pull-requests: read` this job could not have
    # posted a review even if it produced one. Whether that alone explains the
    # silence is still open — see issue #32.
    #
    # Do NOT diagnose this workflow from a PR that edits this file.
    # claude-code-action refuses to run when the workflow file differs from the
    # copy on the default branch ("Workflow validation failed"), so the job
    # exits success in ~6s having done nothing. That is a security control, not
    # a bug: a PR must not be able to rewrite the review workflow and capture
    # the app token. PR #30 edited this file and so could not test its own fix —
    # a mistake already made once, in the comment this one replaces.
    #
    # Nothing depends on it. The rung-2 merge gate (heal-automerge.yml)
    # deliberately does NOT consume this job's result — it makes its own Claude
    # call with a strict verdict contract. This review is for the human, and
    # its absence blocks nothing.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

