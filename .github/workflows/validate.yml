# The CI mirror of `claudeos-validate` (modules/common/claude-helpers.nix):
# format/lint via treefmt (nixfmt + statix + deadnix — the same three the
# local Claude hooks run), then a --dry-run eval of every host the flake
# defines, plus one REAL build so build-time breakage can't ride a green PR.
# This is the testing gate for changes authored on machines without Nix.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

# Rapid pushes supersede each other — cancel the stale run instead of
# building two full host closures side by side
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflows are security-load-bearing (actor gates, the rung-2 merge
  # gate) — lint them like code. Same actionlint the overnight hardening ran.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Lint GitHub Actions workflows
        run: nix run nixpkgs#actionlint -- .github/workflows/*.yml

  flake-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting and lint (treefmt — nixfmt, statix, deadnix)
        run: nix fmt -- --ci

      # modules/shared is consumed by a flake that fetches only that directory.
      # The headless stand-in check (host-build) catches specialArgs and
      # third-party options at eval; this catches what eval cannot: paths
      # that resolve fine here but point outside the directory a consumer gets.
      - name: Shared layer is self-contained
        run: |
          if grep -rnE '\.\./|specialArgs|home-manager|stylix' modules/shared --include='*.nix'; then
            echo "::error::modules/shared must stay self-contained (see modules/shared/README.md)"
            exit 1
          fi

      - name: Dry-run build every host configuration
        run: |
          for host in $(nix flake show --json --all-systems 2>/dev/null | jq -r '.nixosConfigurations | keys[]'); do
            echo "::group::$host"
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --dry-run
            echo "::endgroup::"
          done

  # Eval catches type errors; only a real build catches build-time breakage
  # (patches that no longer apply, failing derivations). One host is enough
  # for an ordinary PR — the two share almost the entire closure. A lock bump
  # gets the primary host on top: see lock-gate.
  host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: ./.github/actions/free-disk

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Build transporter toplevel
        run: nix build ".#nixosConfigurations.transporter.config.system.build.toplevel" --no-link

      # Only modules/shared, no desktop stack: proves the shared layer builds
      # for a headless consumer this repo can't see.
      - name: Build shared-layer headless stand-in
        run: nix build ".#checks.x86_64-linux.shared-headless" --no-link

  # A flake.lock bump moves every input at once, so it gets the on-machine
  # auto-update gate (modules/common/auto-update.nix) replayed in CI: a full
  # build of gti — the primary, whose Hyprland/hardware closure transporter
  # does not cover — then a headless boot of that generation in QEMU, which
  # must print CLAUDEOS-SMOKE-PASS (multi-user.target reached, no failed
  # units, display manager active). Rung 7 of the validation ladder.
  #
  # Scope: PRs and pushes that touch flake.lock or flake.nix, plus edits to
  # this workflow so the gate tests its own changes. Everything else skips
  # the steps but still reports, so the job can be a required check without
  # leaving unrelated PRs pending forever.
  lock-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Does this change move the lock?
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            run=true # new branch / unknown base: test rather than guess
          elif git diff --name-only "$BASE" HEAD |
            grep -qxE 'flake\.lock|flake\.nix|\.github/workflows/validate\.yml'; then
            run=true
          else
            run=false
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"
          echo "lock-gate: run=$run"

      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/free-disk

      # Hosted Linux runners expose /dev/kvm but root-only; the VM boot needs
      # it from the runner user. Without KVM, QEMU falls back to TCG and the
      # boot blows through the timeout rather than failing honestly.
      - name: Enable KVM
        if: steps.scope.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - if: steps.scope.outputs.run == 'true'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # No cache-nix-action here: a lock bump invalidates nearly everything a
      # restored store would hold, and host-build already spends the repo's
      # cache budget. Substitution from cache.nixos.org covers the bulk.
      - name: Build gti toplevel
        if: steps.scope.outputs.run == 'true'
        run: nix build ".#nixosConfigurations.gti.config.system.build.toplevel" --no-link

      - name: Build gti smoke-test VM
        if: steps.scope.outputs.run == 'true'
        run: nix build ".#nixosConfigurations.gti.config.system.build.vm" --out-link result-vm

      # Same verdict the local gate reads. 600 s rather than the local 300:
      # nested KVM on a shared runner boots slower than bare metal.
      - name: Boot gti in QEMU
        if: steps.scope.outputs.run == 'true'
        run: |
          timeout 600 ./result-vm/bin/run-gti-vm </dev/null >vm.log 2>&1 || true
          if grep -q CLAUDEOS-SMOKE-PASS vm.log; then
            grep -m1 CLAUDEOS-SMOKE-PASS vm.log
            exit 0
          fi
          fail=$(grep -m1 CLAUDEOS-SMOKE-FAIL vm.log ||
            echo "VM never reported (timeout or boot hang)")
          echo "::error title=VM smoke test::$fail"
          echo "--- last 150 lines of VM serial console ---"
          tail -n 150 vm.log
          exit 1
