# The CI mirror of `claudeos-validate` (modules/common/claude-helpers.nix):
# format/lint via treefmt (nixfmt + statix + deadnix — the same three the
# local Claude hooks run), then a --dry-run eval of every host the flake
# defines, plus one REAL build so build-time breakage can't ride a green PR.
# This is the testing gate for changes authored on machines without Nix.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

# Rapid pushes supersede each other — cancel the stale run instead of
# building two full host closures side by side
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflows are security-load-bearing (actor gates, the rung-2 merge
  # gate) — lint them like code. Same actionlint the overnight hardening ran.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Lint GitHub Actions workflows
        run: nix run nixpkgs#actionlint -- .github/workflows/*.yml

  flake-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting and lint (treefmt — nixfmt, statix, deadnix)
        run: nix fmt -- --ci

      - name: Dry-run build every host configuration
        run: |
          for host in $(nix flake show --json --all-systems 2>/dev/null | jq -r '.nixosConfigurations | keys[]'); do
            echo "::group::$host"
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --dry-run
            echo "::endgroup::"
          done

  # Eval catches type errors; only a real build catches build-time breakage
  # (patches that no longer apply, failing derivations). One host is enough —
  # the two share almost the entire closure.
  host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The NixOS closure overflows the stock runner's ~14 GB free disk
      # (first run died on ENOSPC) — purge the preinstalled toolchains.
      # Inline rather than wimpysworld/nothing-but-nix: that action nests an
      # unpinned srz-zumix/post-run-action@v3 (still in v10), which the
      # repo-level sha_pinning_required enforcement rejects at job setup.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/graalvm \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Build transporter toplevel
        run: nix build ".#nixosConfigurations.transporter.config.system.build.toplevel" --no-link
