# Evaluates every host's toplevel with --dry-run — the repo's documented
# validation step (CLAUDE.md). Catches eval errors without building anything;
# this is the testing gate for changes authored on machines without Nix.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Dry-run build every host configuration
        run: |
          for host in $(nix flake show --json --all-systems 2>/dev/null | jq -r '.nixosConfigurations | keys[]'); do
            echo "::group::$host"
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --dry-run
            echo "::endgroup::"
          done
