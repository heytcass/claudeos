# Cloud FALLBACK for the weekly on-machine auto-update
# (modules/common/auto-update.nix, Sat 03:00 — that unit remains primary: it
# has the VM smoke-test gate and can actually switch the system). This bot
# covers the one failure mode the local lane can't: both laptops off or
# asleep for weeks. Monday noon UTC is deliberately offset from Saturday so
# the two never race; the local run's `git pull --rebase` absorbs a merged
# bot PR cleanly. PRs are reviewed by claude-code-review.yml and gated by
# validate.yml like any other.
name: Update flake.lock

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # v27 nested damianreeves/write-file-action@v1.3 and
      # juliangruber/read-file-action@v1 — tag pins. This repo requires
      # full-SHA pins and that rule is *transitive*, so every scheduled run
      # since at least 2026-07-13 died at "Set up job" before a step ran,
      # despite this line itself being correctly pinned. v28 SHA-pins all five
      # of its nested actions, which is the actual fix.
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          # A PAT, not the default GITHUB_TOKEN: PRs created by GITHUB_TOKEN
          # deliberately fire NO pull_request workflows (GitHub's recursion
          # guard), so bot PRs arrived with no validate/claude-review at all —
          # discovered 2026-08-21 on PR #108, the workflow's first-ever PR,
          # which needed a manual empty-commit nudge before CI would run. That
          # silently defeated the design note above ("gated by validate.yml
          # like any other") AND the lane's whole purpose (running when nobody
          # is around to nudge). Fine-grained PAT, this repo only,
          # contents+pull-requests write. The || fallback keeps the workflow
          # functional (with the manual-nudge caveat) if the secret is ever
          # deleted or expires.
          token: ${{ secrets.FLAKE_UPDATE_PAT || github.token }}
          pr-title: "chore: weekly flake.lock update (cloud fallback)"
          commit-msg: "chore: weekly flake.lock update (cloud fallback)"
          pr-labels: |
            dependencies
            automated
